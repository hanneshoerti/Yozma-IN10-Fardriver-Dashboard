name: APK bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version fuer das Release, z. B. v0.1.0 (leer = nur bauen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android-SDK pruefen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"
          else VERSION="build-${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Yozma-Dashboard-${VERSION}.apk"
          echo "APK_NAME=Yozma-Dashboard-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Release anlegen
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_NAME }}
          name: Yozma Dashboard ${{ env.VERSION }}
          body: |
            Installierbare APK fuer Android 8.0 oder neuer.
            Installation und Einrichtung: siehe README.
